name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        working-directory: mobile_app
        run: flutter create . --platforms=android

      - name: Disable Lint on release build
        working-directory: mobile_app
        run: |
          python3 -c '
          from pathlib import Path
          for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = Path(name)
              if p.exists():
                  txt = p.read_text(encoding="utf-8")
                  if "checkReleaseBuilds" not in txt:
                      block = "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
                      if "android {" in txt:
                          txt = txt.replace("android {\n", block, 1)
                      p.write_text(txt, encoding="utf-8")
          '

      - name: Install packages
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-green-world-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
